{% extends "base.html" %}

{% block extra_css %}
  {{ super() }}
  <style>
    /* Estilos para el toggle del sidebar */
    .md-header__button.sidebar-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .md-header__button.sidebar-toggle:hover {
      opacity: 0.7;
    }

    .md-sidebar--primary {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s ease;
    }

    .md-sidebar--primary.closed {
      transform: translateX(-100%);
    }

    .md-main {
      transition: margin-left 0.3s ease;
    }

    .md-main.sidebar-closed {
      margin-left: 0;
    }

    @media (max-width: 76.1875em) {
      .md-sidebar--primary.closed {
        position: absolute;
        width: 100%;
        z-index: 10;
      }

      .md-sidebar--primary:not(.closed) {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
      }
    }
  </style>
{% endblock %}

{% block content %}
  {{ super() }}
  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'sidebar-collapsed';
      
      function initSidebarToggle() {
        // Obtener elementos
        const header = document.querySelector('.md-header');
        const sidebar = document.querySelector('.md-sidebar--primary');
        const main = document.querySelector('.md-main');
        
        if (!header || !sidebar || !main) {
          console.warn('Elementos no encontrados para toggle sidebar');
          return;
        }

        // Crear botón toggle
        const toggle = document.createElement('button');
        toggle.className = 'md-header__button sidebar-toggle md-icon';
        toggle.setAttribute('title', 'Alternar menú');
        toggle.setAttribute('type', 'button');
        toggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>';
        
        // Insertar el botón en el header
        const headerContent = header.querySelector('.md-header__inner');
        if (headerContent) {
          headerContent.appendChild(toggle);
        }

        // Cargar estado previo
        const isClosed = localStorage.getItem(STORAGE_KEY) === 'true';
        if (isClosed) {
          applyClosed();
        }

        // Event listener
        toggle.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          const currentlyClosed = sidebar.classList.contains('closed');
          if (currentlyClosed) {
            applyOpen();
            localStorage.setItem(STORAGE_KEY, 'false');
          } else {
            applyClosed();
            localStorage.setItem(STORAGE_KEY, 'true');
          }
        });

        function applyClosed() {
          sidebar.classList.add('closed');
          main.classList.add('sidebar-closed');
        }

        function applyOpen() {
          sidebar.classList.remove('closed');
          main.classList.remove('sidebar-closed');
        }

        // Cerrar sidebar en mobile cuando se hace click en un enlace
        document.querySelectorAll('.md-nav__link, .md-nav__title').forEach(link => {
          link.addEventListener('click', function() {
            if (window.innerWidth < 76.1875 * 16) { // Menos de 76.1875em
              applyClosed();
              localStorage.setItem(STORAGE_KEY, 'true');
            }
          });
        });
      }

      // Esperar a que el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSidebarToggle);
      } else {
        initSidebarToggle();
      }
    })();
  </script>
{% endblock %}
