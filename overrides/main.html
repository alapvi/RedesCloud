{% extends "base.html" %}

{% block extra_css %}
  {{ super() }}
  <style>
    .md-sidebar--primary {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .md-sidebar--primary.toggled {
      margin-left: -30.1rem;
      width: 0 !important;
      overflow: hidden;
      display: none;
    }

    .md-content {
      transition: all 0.3s ease !important;
    }

    .sidebar-toggle-btn {
      display: inline-block !important;
      width: auto !important;
      padding: 0.4rem 0.8rem !important;
      margin-left: 0.5rem !important;
      border: none !important;
      background: transparent !important;
      cursor: pointer !important;
      font-size: 1.5rem !important;
      color: inherit !important;
    }

    .sidebar-toggle-btn:hover {
      opacity: 0.7;
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    // Esperar a que el documento esté completamente cargado
    function initToggleSidebar() {
      console.log('[Sidebar Toggle] Iniciando...');
      
      const header = document.querySelector('.md-header');
      const sidebar = document.querySelector('.md-sidebar--primary');
      
      if (!header || !sidebar) {
        console.warn('[Sidebar Toggle] No se encontraron elementos necesarios');
        setTimeout(initToggleSidebar, 100);
        return;
      }

      console.log('[Sidebar Toggle] Elementos encontrados');

      // Crear botón si no existe
      let btn = document.querySelector('.sidebar-toggle-btn');
      if (!btn) {
        btn = document.createElement('button');
        btn.className = 'sidebar-toggle-btn';
        btn.innerHTML = '☰';
        btn.title = 'Alternar menú';
        btn.type = 'button';
        
        // Insertar después del logo
        const header_inner = header.querySelector('.md-header__inner');
        if (header_inner) {
          const logo = header_inner.querySelector('.md-logo');
          if (logo) {
            logo.after(btn);
            console.log('[Sidebar Toggle] Botón insertado');
          }
        }
      }

      // Cargar estado previo
      const toggled = localStorage.getItem('sidebar-toggled') === 'true';
      if (toggled) {
        sidebar.classList.add('toggled');
        console.log('[Sidebar Toggle] Estado cargado: cerrado');
      }

      // Event listener
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const isToggled = sidebar.classList.contains('toggled');
        
        if (isToggled) {
          sidebar.classList.remove('toggled');
          localStorage.setItem('sidebar-toggled', 'false');
          console.log('[Sidebar Toggle] Abriendo...');
        } else {
          sidebar.classList.add('toggled');
          localStorage.setItem('sidebar-toggled', 'true');
          console.log('[Sidebar Toggle] Cerrando...');
        }
      });

      console.log('[Sidebar Toggle] Inicialización completada');
    }

    // Iniciar cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initToggleSidebar);
    } else {
      setTimeout(initToggleSidebar, 100);
    }

    // También iniciar cuando la página cambia (Material MkDocs instantaneous loading)
    window.addEventListener('pydata-page', initToggleSidebar);
  </script>
{% endblock %}
