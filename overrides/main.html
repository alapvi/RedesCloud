{% extends "base.html" %}

{% block extra_css %}
  {{ super() }}
  <style>
    /* Estilo para el toggle del sidebar */
    .md-sidebar--primary {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      transform: translateX(0) !important;
    }

    .md-sidebar--primary.hidden {
      transform: translateX(-100%) !important;
    }

    .sidebar-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      margin: 0.4rem 0 0.4rem 0.5rem;
      padding: 0;
      border: none;
      background-color: transparent;
      color: inherit;
      cursor: pointer;
      transition: background-color 0.25s;
      font-size: 1.5rem;
    }

    .sidebar-toggle-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    [data-md-color-scheme="slate"] .sidebar-toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
{% endblock %}

{% block header %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Variables
      const STORAGE_KEY = 'md-sidebar-hidden';
      let sidebarHidden = localStorage.getItem(STORAGE_KEY) === 'true';

      // Función para crear e insertar botón
      function setupToggleButton() {
        const header = document.querySelector('.md-header__inner');
        
        if (!header) {
          return setTimeout(setupToggleButton, 100);
        }

        // No crear si ya existe
        if (document.querySelector('.sidebar-toggle-btn')) {
          return;
        }

        // Crear botón
        const btn = document.createElement('button');
        btn.className = 'sidebar-toggle-btn';
        btn.setAttribute('type', 'button');
        btn.setAttribute('title', 'Alternar menú lateral');
        btn.setAttribute('aria-label', 'Alternar menú lateral');
        btn.innerHTML = '☰';

        // Insertar al inicio del header
        header.insertBefore(btn, header.firstChild);

        // Listener del botón
        btn.addEventListener('click', toggleSidebar);

        // Aplicar estado guardado
        applyToggleState();
      }

      // Función para aplicar estado
      function applyToggleState() {
        const sidebar = document.querySelector('.md-sidebar--primary');
        if (!sidebar) return;

        if (sidebarHidden) {
          sidebar.classList.add('hidden');
        } else {
          sidebar.classList.remove('hidden');
        }
      }

      // Función toggle
      function toggleSidebar(e) {
        e.preventDefault();
        e.stopPropagation();

        sidebarHidden = !sidebarHidden;
        localStorage.setItem(STORAGE_KEY, sidebarHidden ? 'true' : 'false');
        applyToggleState();
      }

      // Iniciar setup
      setupToggleButton();

      // Reintentar en caso de que sea lazy-loaded
      setTimeout(setupToggleButton, 500);
    });

    // También ejecutar después de navegación instantánea
    document.addEventListener('mdChange', function() {
      const btn = document.querySelector('.sidebar-toggle-btn');
      if (!btn) {
        setTimeout(function() {
          const STORAGE_KEY = 'md-sidebar-hidden';
          const sidebarHidden = localStorage.getItem(STORAGE_KEY) === 'true';
          const sidebar = document.querySelector('.md-sidebar--primary');
          
          if (sidebar) {
            if (sidebarHidden) {
              sidebar.classList.add('hidden');
            } else {
              sidebar.classList.remove('hidden');
            }
          }
        }, 100);
      }
    });
  </script>
{% endblock %}
