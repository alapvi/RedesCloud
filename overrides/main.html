{% extends "base.html" %}

{% block extra_css %}
  {{ super() }}
  <style>
    /* Botón de toggle para el sidebar */
    .md-header__button--sidebar-toggle {
      display: inline-block;
      margin: 0.5rem 0;
    }

    .sidebar-toggle-btn {
      padding: 0.5rem;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--md-typeset-color);
      transition: color 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      color: var(--md-primary-fg-color);
    }

    /* Hacer el sidebar collapsible */
    .md-sidebar--primary {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .md-sidebar--primary.collapsed {
      transform: translateX(-100%);
      position: absolute;
      z-index: 100;
    }

    .md-content {
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .md-content.expanded {
      margin-left: 0;
    }

    /* En dispositivos pequeños */
    @media only screen and (max-width: 76.1875em) {
      .md-sidebar--primary {
        transform: translateX(-100%);
        position: absolute;
        z-index: 100;
      }

      .md-sidebar--primary.show {
        transform: translateX(0);
      }
    }
  </style>
{% endblock %}

{% block header %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Crear botón de toggle
      const header = document.querySelector('.md-header');
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'sidebar-toggle-btn';
      toggleBtn.setAttribute('aria-label', 'Alternar menú lateral');
      toggleBtn.innerHTML = '☰';
      toggleBtn.style.marginLeft = '0.5rem';
      
      // Insertar después del logo
      const logo = header.querySelector('.md-header__button:first-of-type');
      if (logo) {
        logo.parentNode.insertBefore(toggleBtn, logo.nextSibling);
      }

      // Obtener sidebar
      const sidebar = document.querySelector('.md-sidebar--primary');
      const content = document.querySelector('.md-container');
      
      // Estado del sidebar
      let sidebarOpen = true;
      
      // Cargar estado guardado
      const savedState = localStorage.getItem('sidebar-state');
      if (savedState !== null) {
        sidebarOpen = savedState === 'open';
      }
      
      // Aplicar estado inicial
      updateSidebar();
      
      // Event listener para el botón
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        sidebarOpen = !sidebarOpen;
        updateSidebar();
        localStorage.setItem('sidebar-state', sidebarOpen ? 'open' : 'closed');
      });
      
      function updateSidebar() {
        if (window.innerWidth > 76.1875 * 16) { // 76.1875em en px
          // Desktop: siempre mostrar pero permitir collapse
          if (sidebarOpen) {
            sidebar?.classList.remove('collapsed');
            toggleBtn.innerHTML = '☰';
          } else {
            sidebar?.classList.add('collapsed');
            toggleBtn.innerHTML = '→';
          }
        } else {
          // Mobile: mostrar/ocultar completamente
          if (sidebarOpen) {
            sidebar?.classList.add('show');
            toggleBtn.innerHTML = '✕';
          } else {
            sidebar?.classList.remove('show');
            toggleBtn.innerHTML = '☰';
          }
        }
      }
      
      // Actualizar en resize
      window.addEventListener('resize', updateSidebar);
      
      // Cerrar sidebar al hacer click en un enlace (mobile)
      const navLinks = document.querySelectorAll('.md-nav__link');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 76.1875 * 16) {
            sidebarOpen = false;
            updateSidebar();
            localStorage.setItem('sidebar-state', 'closed');
          }
        });
      });
    });
  </script>
{% endblock %}
